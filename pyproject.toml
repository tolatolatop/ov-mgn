[project]
name = "ov-mgn"
version = "0.1.0"
description = "OpenViking management CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "InquirerPy>=0.3.4",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
ov-mgn = "ov_mgn.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
